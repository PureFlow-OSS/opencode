    <title>OpenCode</title>
    <link rel="icon" type="image/png" href="./favicon-96x96-v3.png" sizes="96x96" />

    <style>
      @keyframes boot-pulse {
        50% {
          opacity: 0.35;
        }
      }
      #root {
        background: var(--background-base, #f8f7f7);
      }
      .boot-splash {
        height: 100dvh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background-base, #f8f7f7);
      }
      .boot-splash svg {
        width: 112px;
        height: 112px;
        color: var(--icon-strong-base, #111111);
        opacity: 0.5;
        animation: boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
