trigger:
  branches:
    include:
      - main

# PM_Build is a SHARED pool with many Linux agents + a Windows one.
pool:
  name: 'PM_Build'
  demands:
    - Agent.OS -equals Windows_NT
    # - Agent.Name -equals RBIDEVTWE

variables:
  # --- Code signing (Azure Key Vault + AzureSignTool) ---
  - name: KEYVAULT_URL
    value: 'https://kv-pfh-codesigning.vault.azure.net/'
  - name: CERT_ALIAS                         # the certificate NAME in Key Vault
    value: 'digiCert-CodeSigning'
  - name: TIMESTAMP_URL
    value: 'http://timestamp.digicert.com'

  # --- Product / build ---
  - name: PRODUCT_VERSION
    value: '1.14.34'
  - name: BUN_VERSION
    value: '1.3.13'
  # The fork's Electron app lives in packages/desktop-electron
  # (packages/desktop is the older Tauri app).
  - name: DESKTOP_PKG
    value: 'desktop-electron'
  - name: OPENCODE_UPDATE_CACHE_DIR
    value: 'C:/Entwicklung'
  # Embedded update base URL (your internal update server). build-node.ts bakes
  # this into the CLI via its OPENCODE_UPDATE_BASE_URL define.
  - name: OPENCODE_UPDATE_BASE_URL
    value: 'http://opencode.pfcicd.local.programmierfabrik.at/opencode'

stages:
  - stage: BuildAndPackage
    displayName: 'Build and Package OpenCode (Electron)'
    jobs:
      - job: BuildOpenCode
        displayName: 'Build OpenCode Electron Installer'
        timeoutInMinutes: 90
        steps:

          # =================================================================
          # 0. Toolchain: Node + .NET (for AzureSignTool)
          # =================================================================
          - task: NodeTool@0
            displayName: 'Use Node.js 22'
            inputs:
              versionSpec: '22.x'

          - task: UseDotNet@2
            displayName: 'Use .NET SDK 8'
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - powershell: |
              $ErrorActionPreference = 'Stop'
              dotnet tool update --global AzureSignTool
              Write-Host "##vso[task.prependpath]$env:USERPROFILE\.dotnet\tools"
            displayName: 'Install AzureSignTool'

          # =================================================================
          # 1. Preflight
          # =================================================================
          - powershell: |
              $ErrorActionPreference = 'Stop'
              foreach ($t in @('node','bun','AzureSignTool')) {
                if (-not (Get-Command $t -ErrorAction SilentlyContinue)) {
                  throw "Required tool '$t' not found on the agent."
                }
              }
              Write-Host "Tooling OK:"; node --version; bun --version; AzureSignTool --version
            displayName: 'Preflight tooling check'

          # =================================================================
          # 2. Install dependencies
          # =================================================================
          - powershell: |
              $ErrorActionPreference = 'Stop'
              $env:GIT_TERMINAL_PROMPT = '0'
              bun install --frozen-lockfile
            displayName: 'bun install'

          # =================================================================
          # 3. Build + package + sign
          # -----------------------------------------------------------------
          # Uses the package's own "package:win" script:
          #   package:win = "bun run build && electron-builder --win --config electron-builder.config.ts"
          # Running it via `bun run` puts node_modules/.bin on PATH, so
          # electron-builder is found (a bare command / npx / bunx is not).
          # Signing happens through electron-builder's win.sign hook in
          # packages/desktop-electron/electron-builder.config.ts (-> AzureSignTool),
          # which reads the AZURE_KEYVAULT_* env below.
          # =================================================================
          - powershell: |
              $ErrorActionPreference = 'Stop'

              $productVersion = (git describe --tags --abbrev=0).TrimStart('v')
              if (-not $productVersion) {
                $productVersion = '1.14.34'
              }
              Write-Host "##vso[task.setvariable variable=PRODUCT_VERSION]$productVersion"

              # build env
              $env:OPENCODE_CHANNEL = 'prod'
              $env:OPENCODE_VERSION = $productVersion
              $env:OPENCODE_UPDATE_BASE_URL = "$(OPENCODE_UPDATE_BASE_URL)"
              $env:OPENCODE_UPDATE_CACHE_DIR = "$(OPENCODE_UPDATE_CACHE_DIR)"

              # signing env (electron-builder win.sign hook -> AzureSignTool)
              $env:AZURE_KEYVAULT_URL           = "$(KEYVAULT_URL)"
              $env:AZURE_KEYVAULT_CLIENT_ID     = $env:KEYVAULT_CLIENT_ID
              $env:AZURE_KEYVAULT_CLIENT_SECRET = $env:KEYVAULT_CLIENT_SECRET
              $env:AZURE_KEYVAULT_TENANT_ID     = $env:KEYVAULT_TENANT_ID
              $env:AZURE_KEYVAULT_CERT          = "$(CERT_ALIAS)"
              $env:AZURE_TIMESTAMP_URL          = "$(TIMESTAMP_URL)"
              $env:CSC_IDENTITY_AUTO_DISCOVERY  = 'false'

              Set-Location "packages/$(DESKTOP_PKG)"
              bun run package:win -- --publish never

              Write-Host "=== dist ==="
              Get-ChildItem dist
              $installer = Get-ChildItem dist -Filter '*.exe' |
                Where-Object { $_.Name -notlike '*.blockmap' -and $_.Name -notlike 'OpenCode-Setup-*' } |
                Select-Object -First 1
              if (-not $installer) { throw "No NSIS installer produced in dist/" }
              Copy-Item $installer.FullName "dist/OpenCode-Setup-$productVersion.exe" -Force
              Write-Host "OK - signed installer: dist/OpenCode-Setup-$productVersion.exe"
            displayName: 'Build + package + sign (electron-builder + AzureSignTool)'
            env:
              KEYVAULT_CLIENT_ID: $(KEYVAULT_CLIENT_ID)
              KEYVAULT_CLIENT_SECRET: $(KEYVAULT_CLIENT_SECRET)
              KEYVAULT_TENANT_ID: $(KEYVAULT_TENANT_ID)

          # =================================================================
          # 4. Publish artifact
          # =================================================================
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact'
            inputs:
              PathtoPublish: 'packages/$(DESKTOP_PKG)/dist/OpenCode-Setup-$(PRODUCT_VERSION).exe'
              ArtifactName: 'OpenCode-Signed-Installer'
              publishLocation: 'Container'
