services:
  opencode-updater:
    build: .
    ports:
      - "80:8080"
    restart: unless-stopped
    volumes:
      - feedback-data:/app/data

  opencode-updater-admin-ui:
    build:
      context: ./admin-ui
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      - opencode-updater

volumes:
  feedback-data:
