services:
  opencode-updater:
    build: .
    ports:
      - "80:8080"
    volumes:
      - opencode-updater-data:/app/data
      - ./appsettings.json:/app/appsettings.json
      - ./appsettings.beta.json:/app/appsettings.beta.json
    restart: unless-stopped

  opencode-updater-admin-ui:
    build:
      context: ./admin-ui
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      - opencode-updater

volumes:
  opencode-updater-data:
