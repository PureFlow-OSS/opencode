# Local browser test only; combine with docker-compose.yml and docker-compose.keycloak.yml.
# Run scripts/prepare-local-keycloak-https.ps1 and set OPENCODE_ADMIN_TLS_DIR to its output directory.
# Register https://localhost/opencode/auth/signin-oidc in the Keycloak client first.
services:
  opencode-updater:
    ports: !override
      - "127.0.0.1:80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      AdminAuthentication__PublicOrigin: https://localhost
      AdminAuthentication__AllowHttpLoopback: "false"
  opencode-updater-admin-ui:
    ports: !override
      - "127.0.0.1:8081:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8443:444"
    volumes:
      - type: bind
        source: ${OPENCODE_ADMIN_TLS_DIR:?Prepare the localhost HTTPS certificate directory}/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${OPENCODE_ADMIN_TLS_DIR:?Prepare the localhost HTTPS certificate directory}/localhost.pem
        target: /etc/nginx/opencode-tls/localhost.pem
        read_only: true
      - type: bind
        source: ${OPENCODE_ADMIN_TLS_DIR:?Prepare the localhost HTTPS certificate directory}/localhost.key
        target: /etc/nginx/opencode-tls/localhost.key
        read_only: true
