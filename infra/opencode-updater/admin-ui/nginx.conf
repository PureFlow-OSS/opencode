server {
  listen 80;
  server_name _;
  # Preserve the browser's HTTPS scheme and external port behind Caddy/Docker.
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1g;

  # Browser icon requests must not start a second OAuth flow on the sign-in/error pages.
  location = /favicon.ico {
    access_log off;
    return 204;
  }

  location /opencode/ {
    proxy_pass http://opencode-updater:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    auth_request /_admin_authorization;
    error_page 401 = @keycloak_login;
    error_page 403 = /opencode/auth/forbidden;
    add_header Cache-Control "private, no-store" always;
    try_files $uri $uri/ /index.html;
  }

  location = /_admin_authorization {
    internal;
    proxy_method GET;
    proxy_pass http://opencode-updater:8080/opencode/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
  }

  location @keycloak_login {
    return 302 /opencode/auth/login;
  }
}
